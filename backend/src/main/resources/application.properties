spring.application.name=vulntrack-backend
# 8080 is already used by another local container (webgoat)
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/vulntrack
spring.datasource.username=vulntrack_user
spring.datasource.password=vulntrack_pass

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Single demo user. The password is BCrypt-hashed at startup and never stored in plain form in memory.
# Override both secrets via environment variables outside local development.
vulntrack.auth.username=admin
vulntrack.auth.password=${VULNTRACK_ADMIN_PASSWORD:vulntrack-demo}
# HMAC-SHA256 signing key; must be at least 32 bytes
vulntrack.auth.jwt-secret=${VULNTRACK_JWT_SECRET:local-dev-only-jwt-signing-secret-change-me}
vulntrack.auth.jwt-expiration=1h
