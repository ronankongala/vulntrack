{{- $sel := dict "root" . "component" "postgres" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulntrack.postgres.name" . }}
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
    {{- include "vulntrack.selector" $sel | nindent 4 }}
spec:
  replicas: 1
  # A ReadWriteOnce volume can only be mounted by one pod, so never run old and new side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vulntrack.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vulntrack.selector" $sel | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "vulntrack.postgres.name" . }}
          env:
            # Subdirectory, because the volume root contains lost+found on some provisioners.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vulntrack.postgres.name" . }}-data
