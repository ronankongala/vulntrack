{{- $name := include "vulntrack.backend.name" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.username | b64enc }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.password | b64enc }}
  VULNTRACK_JWT_SECRET: {{ include "vulntrack.secretValue" (dict "root" . "secret" $name "key" "VULNTRACK_JWT_SECRET" "value" .Values.backend.jwtSecret) }}
  VULNTRACK_ADMIN_PASSWORD: {{ include "vulntrack.secretValue" (dict "root" . "secret" $name "key" "VULNTRACK_ADMIN_PASSWORD" "value" .Values.backend.adminPassword) }}
