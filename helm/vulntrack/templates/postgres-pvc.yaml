apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vulntrack.postgres.name" . }}-data
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
